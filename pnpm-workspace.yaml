packages:
  - "apps/*"
  - "packages/*"

confirmModulesPurge: false
minimumReleaseAge: 0

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "prisma"
  - "unrs-resolver"

allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  "esbuild": true
  "prisma": true
  "unrs-resolver": true
