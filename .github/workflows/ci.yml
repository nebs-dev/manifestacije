name: CI

# The repository had no CI at all: Railway (API) and Vercel (web) both deploy
# from a push to main, with nothing run in between. This workflow is the gate
# that was missing. It does not touch either deployment — it only reports, and
# it is made a required check in the repository settings when you are ready for
# it to block merges.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the Vercel project's configured runtime (24.x) and .nvmrc, so CI,
  # the deployed web app and a developer running `nvm use` are all on the same
  # major. Verified green on 22.13.0, 24.22.2 and 26.5.0 before pinning.
  # Playwright is pinned exactly in package.json so the library and the browser
  # build never drift apart.
  NODE_VERSION: "24.22.2"
  PNPM_VERSION: "11.9.0"

jobs:
  # Fast feedback: the two unit suites plus both typechecks. Nothing here needs
  # a database or a browser, so it finishes in a couple of minutes and catches
  # most mistakes before the slower job starts.
  checks:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The API's Prisma client is generated code; tsc and jest both need it.
      - run: pnpm --filter api exec prisma generate

      - name: Typecheck API, web and the E2E suite
        run: |
          pnpm --filter api lint
          pnpm --filter web lint
          pnpm e2e:typecheck

      - name: API unit and integration tests
        run: pnpm --filter api test

      - name: Web unit tests
        run: pnpm --filter web test

  # The production build, kept separate so a build break is reported as a build
  # break rather than hiding inside the E2E job's setup.
  build:
    name: Production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api build
      - name: Build web
        # Mirrors the real build's inputs without any real values; the web app
        # only warns when the optional browser keys are absent.
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3301
          NEXT_PUBLIC_WEB_URL: http://127.0.0.1:3300
          NEXT_PUBLIC_GA_ID: ""
          NEXT_PUBLIC_CARTO_BASEMAP_KEY: ""
        run: pnpm --filter web build

  # The whole Chromium project, not just @smoke. Measured cold on this repo:
  # the @smoke subset takes 53s and all 28 specs take 58-64s, because building
  # apps/api and apps/web dominates and the extra 17 tests add about ten
  # seconds. There is no reason to run the smaller set.
  # WebKit and the two phone profiles stay out of the gate: they need a second
  # browser download and add roughly 45s, and they cover presentation rather
  # than the critical path. Run them locally with `pnpm e2e`.
  e2e:
    name: E2E (Chromium, full suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      # The same disposable database the suite uses locally, on the same port
      # and with the same name, so support/env.ts needs no CI-specific branch
      # and its safety guard stays meaningful.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: e2e_qa
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
        ports:
          - 5443:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d e2e_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve the pinned Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # --with-deps installs the system libraries the browser needs on a clean
      # runner; the browser build itself comes from the cache above when warm.
      - run: pnpm exec playwright install --with-deps chromium

      - name: Run the Chromium suite
        # No secrets are passed in, by design. support/env.ts sets every
        # provider variable explicitly — the AI goes to a local stub, email is
        # logged rather than sent, and the upload and geocoding keys are blank.
        # So there is nothing for a trace, a screenshot or this log to leak.
        run: pnpm e2e:ci

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/.artifacts/report
            e2e/.artifacts/test-results
          retention-days: 7
